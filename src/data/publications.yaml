- id: altabaa2026transformertheories
  title: Putting Transformer Theories to the Test
  authors:
    - Awni Altabaa
    - Tobias Schnabel
    - Kiran Tomlinson
  year: 2026
  venue: arXiv preprint
  selected: true
  preview: transformer-theories.webp
  links:
    arxiv: '2610.32104'
    blog: /blog/transformer-theories
  abstract: 'Several formal theories have been developed to characterize the capabilities and limitations of the transformer architecture, each employing different abstractions that capture different features of the architecture. Due to the differences in their underlying assumptions and conceptual frameworks, these theories can disagree in their predictions about what tasks transformers find easy or hard. We map out seven theories of transformer capability (Star-free, AC0, TC0, C-RASP, MPC, BAPO, and Sensitivity) and translate their results into a common matrix of predictions across a suite of tasks covering different computational structures. We provide new theoretical results to complete this matrix. We then evaluate theoretical predictions through controlled experiments measuring in-distribution sample complexity, length generalization, and pretrained language model performance. We find that no single theory explains the observed pattern of successes and failures. When a theory does not capture the transformer behaviors relevant to a task, its predictions break down; for instance, we show that the k-hop induction task is predicted hard by C-RASP because it does not model content-dependent attention, but we train small transformers on this task that length-generalize. Similarly, theories assuming hard attention like AC0 and BAPO predict binary majority to be hard, for which we also find success in practice. Together, our results point to several specific features that a theory of transformers must capture: soft rather than hard attention, dynamic content-dependent retrieval, bounded computation at each position, an account of learnability and inductive biases, and a combination of upper and lower bounds.'
  bibtex: |
    @misc{altabaa2026transformertheories,
      author = {Altabaa, Awni and Schnabel, Tobias and Tomlinson, Kiran},
      title = {Putting Transformer Theories to the Test},
      year = {2026},
      url = {https://arxiv.org/abs/2610.32104},
      eprint = {2610.32104},
      archivePrefix = {arXiv},
      primaryClass = {cs.LG}
    }
- id: altabaa2026latentstrategies
  title: Uncovering Latent Reasoning Strategies in Language Models
  authors:
    - Awni Altabaa
    - John Lafferty
  year: 2026
  venue: arXiv preprint
  selected: true
  preview: latent-strategies-in-lms.webp
  links:
    arxiv: '2607.17674'
    code: https://github.com/Awni00/latent-strategies-in-lms
    blog: /blog/latent-strategies-in-lms
  abstract: A language model p(y | x) trained on reasoning tasks learns to solve problems via multiple distinct strategies, yet these strategies are implicit and entangled within the model's response distribution. We study the problem of decomposing the response distribution of a given pretrained language model into a structured, strategy-conditioned representation. Specifically, we learn a latent-variable factorization p(y | x) ⇝ (r(z | x), g(y | x, z)), where a router r maps each input to a distribution over latent strategies z and a generator g produces the response conditioned on that strategy. A key challenge is that the generator, initialized from the base model, already represents p(y | x) without using z. Standard variational inference therefore gives the model no incentive to route information through z and can yield a severe form of posterior collapse. To address this, we propose a variational objective that measures fractional information gain relative to the base model's response loss and concentrates reconstruction pressure on tokens with high base model surprisal, encouraging z to encode strategy-relevant response variation. We introduce a benchmark of multi-strategy algorithmic tasks and show that this objective recovers latent codes aligned with distinct reference strategies while preserving the base model's response distribution.
  bibtex: |
    @misc{altabaa2026latentstrategies,
      author = {Altabaa, Awni and Lafferty, John},
      title = {Uncovering Latent Reasoning Strategies in Language Models},
      year = {2026},
      url = {https://arxiv.org/abs/2607.17674},
      eprint = {2607.17674},
      archivePrefix = {arXiv},
      primaryClass = {cs.LG}
    }
- id: altabaa2025recursivelatent
  title: Unlocking Out-of-Distribution Generalization in Transformers via Recursive Latent Space Reasoning
  authors:
    - Awni Altabaa
    - Siyu Chen
    - John Lafferty
    - Zhuoran Yang
  year: 2025
  venue: arXiv preprint
  selected: true
  preview: algorithmic-generalization-transformer-architectures.webp
  links:
    arxiv: '2510.14095'
    code: https://github.com/Awni00/algorithmic-generalization-transformer-architectures
    blog: /blog/recursive-latent-reasoning
  tldr: 'We introduce and explore a set of four architectural mechanisms aimed at enhancing out-of-distribution algorithmic generalization: input-adaptive recurrence, algorithmic supervision, anchored latent representations via a discrete bottleneck, and an explicit error-correction mechanism.'
  abstract: 'Systematic, compositional generalization beyond the training distribution remains a core challenge in machine learning -- and a critical bottleneck for the emergent reasoning abilities of modern language models. This work investigates out-of-distribution (OOD) generalization in Transformer networks using a GSM8K-style modular arithmetic on computational graphs task as a testbed. We introduce and explore a set of four architectural mechanisms aimed at enhancing OOD generalization: (i) input-adaptive recurrence; (ii) algorithmic supervision; (iii) anchored latent representations via a discrete bottleneck; and (iv) an explicit error-correction mechanism. Collectively, these mechanisms yield an architectural approach for native and scalable latent space reasoning in Transformer networks with robust algorithmic generalization capabilities. We complement these empirical results with a detailed mechanistic interpretability analysis that reveals how these mechanisms give rise to robust OOD generalization abilities.'
  bibtex: |
    @misc{altabaa2025recursivelatent,
      author = {Altabaa, Awni and Chen, Siyu and Lafferty, John and Yang, Zhuoran},
      title = {Unlocking Out-of-Distribution Generalization in Transformers via Recursive Latent Space Reasoning},
      year = {2025},
      url = {https://arxiv.org/abs/2510.14095},
      eprint = {2510.14095},
      archivePrefix = {arXiv},
      primaryClass = {cs.LG}
    }
- id: altabaa2025cotinformation
  title: 'CoT Information: Improved Sample Complexity under Chain-of-Thought Supervision'
  authors:
    - Awni Altabaa
    - Omar Montasser
    - John Lafferty
  year: 2025
  venue: Neural Information Processing Systems (NeurIPS)
  award: Spotlight
  selected: true
  preview: cot-info.webp
  links:
    arxiv: '2505.15927'
    blog: /blog/cot-info
    slides: /publications/slides/cotinfo-slides.pdf
    poster: /publications/posters/cotinfo-poster.pdf
    publisher: https://proceedings.neurips.cc/paper_files/paper/2025/hash/235a9abbb6303fac26f205367fe08c0b-Abstract-Conference.html
  tldr: We develop a statistical theory of learning under chain-of-thought supervision, introducing the CoT information measure to quantify the additional discriminative power gained from observing the reasoning process.
  abstract: Learning complex functions that involve multi-step reasoning poses a significant challenge for standard supervised learning from input-output examples. Chain-of-thought (CoT) supervision, which provides intermediate reasoning steps together with the final output, has emerged as a powerful empirical technique, underpinning much of the recent progress in the reasoning capabilities of large language models. This paper develops a statistical theory of learning under CoT supervision. A key characteristic of the CoT setting, in contrast to standard supervision, is the mismatch between the training objective (CoT risk) and the test objective (end-to-end risk). A central part of our analysis, distinguished from prior work, is explicitly linking those two types of risk to achieve sharper sample complexity bounds. This is achieved via the CoT information measure, which quantifies the additional discriminative power gained from observing the reasoning process. The main theoretical results demonstrate how CoT supervision can yield significantly faster learning rates compared to standard E2E supervision.
  bibtex: |
    @inproceedings{altabaa2025cotinformation,
      author = {Altabaa, Awni and Montasser, Omar and Lafferty, John},
      title = {{CoT} Information: Improved Sample Complexity under Chain-of-Thought Supervision},
      booktitle = {Advances in Neural Information Processing Systems},
