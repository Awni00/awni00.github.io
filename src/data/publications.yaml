- id: altabaa2024relconv
  title: Learning Hierarchical Relational Representations through Relational Convolutions
  authors:
    - Awni Altabaa
    - John Lafferty
  year: 2024
  venue: Transactions on Machine Learning Research (TMLR)
  selected: true
