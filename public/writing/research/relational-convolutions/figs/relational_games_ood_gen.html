<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      html, body, #relational_games_ood_gen {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="relational_games_ood_gen"></div>
    <script>
      fetch("./relational_games_ood_gen.json")
        .then((response) => response.json())
        .then((figure) => {
          const layout = figure.layout || {};
          layout.autosize = true;
          Plotly.react("relational_games_ood_gen", figure.data || [], layout, { responsive: true });
        });
    </script>
  </body>
</html>
