<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      html,
      body,
      #contains_set_acc {
        width: 100%;
        height: 100%;
        margin: 0;
        min-width: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="contains_set_acc"></div>
    <script>
      const plot = document.getElementById("contains_set_acc");
      const clone = (value) => JSON.parse(JSON.stringify(value || {}));
      const relayoutForWidth = (width) => {
        const mobile = width < 520;
        return {
          autosize: true,
          showlegend: false,
          bargap: mobile ? 0.14 : 0.22,
          "font.size": mobile ? 10 : 12,
          "title.font.size": mobile ? 14 : 16,
          "margin.l": mobile ? 42 : 50,
          "margin.r": mobile ? 4 : 12,
          "margin.t": mobile ? 50 : 54,
          "margin.b": mobile ? 94 : 82,
          "xaxis.automargin": true,
          "xaxis.tickangle": mobile ? -42 : -32,
          "xaxis.tickfont.size": mobile ? 10 : 11,
          "xaxis.title.standoff": mobile ? 4 : 6,
          "yaxis.automargin": true,
          "yaxis.tickfont.size": mobile ? 10 : 11,
          "yaxis.title.standoff": mobile ? 4 : 6
        };
      };
      const resizePlot = () => {
        const width = plot.clientWidth || document.documentElement.clientWidth || window.innerWidth;
        Plotly.relayout(plot, relayoutForWidth(width)).then(() => Plotly.Plots.resize(plot));
      };

      fetch("./contains_set_acc.json")
        .then((response) => response.json())
        .then((figure) => {
          const layout = clone(figure.layout);
          delete layout.width;
          delete layout.height;
          layout.autosize = true;
          Plotly.react(plot, figure.data || [], layout, { responsive: true, displaylogo: false })
            .then(resizePlot)
            .then(() => {
              const observer = new ResizeObserver(() => requestAnimationFrame(resizePlot));
              observer.observe(plot);
              window.addEventListener("resize", resizePlot);
            });
        });
    </script>
  </body>
</html>
