<html lang="en">

  <title>ELBO Failure Dynamics</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #151515;
      --muted: #5f6670;
      --grid: #d0d6da;
      --panel-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      background: #ffffff;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .elbo-figure {
      width: min(100%, 860px);
      margin: 0 auto;
      padding: 4px;
      background: var(--panel-bg);
    }

    .chart-shell {
      position: relative;
      width: 100%;
      background: var(--panel-bg);
      overflow: visible;
    }

    .chart {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .tooltip {
      position: absolute;
      left: 0;
      top: 0;
      min-width: 176px;
      max-width: 260px;
      padding: 8px 9px;
      border: 1px solid #d8dee7;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 6px 18px rgba(24, 32, 44, 0.12);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.35;
      pointer-events: none;
      opacity: 0;
      transition: opacity 120ms ease;
      z-index: 2;
    }

    .tooltip[data-visible="true"] {
      opacity: 1;
    }

    .tooltip__label {
      font-weight: 700;
      margin-bottom: 3px;
    }

    .tooltip__row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .fallback {
      display: block;
      width: 100%;
      height: auto;
      background: var(--panel-bg);
    }
  </style>
</head>

        <desc id="figure-desc">Line chart showing distributional fidelity, strategy alignment, and posterior-router KL over training progress.</desc>
      </svg>
      <div class="tooltip" data-tooltip aria-hidden="true"></div>
    </div>

    <noscript>
      <img class="fallback" src="fallback.png" alt="Static ELBO failure dynamics plot." />

      "xLabel": "Training progress",
      "yLabel": "Metric value"
};

    const figure = document.querySelector("[data-elbo-figure]");
    const svg = document.querySelector("[data-chart]");
    const tooltip = document.querySelector("[data-tooltip]");

    const state = {
      progress: 1,
      hasAnimated: false,
    };

    const WIDTH = 860;
    const HEIGHT = 460;
    const PLOT = { left: 108, right: 36, top: 22, bottom: 82 };
    const LABEL_X_PROGRESS = 0.58;
    const LABEL_Y_OFFSET = {
      distributional_fidelity: 30,
      strategy_alignment: -30,
      posterior_router_kl: -30,
    };
    const NS = "http://www.w3.org/2000/svg";
    const ANIMATION_MS = 1650;

    function createSvg(tag, attrs = {}) {
      const node = document.createElementNS(NS, tag);
      for (const [key, value] of Object.entries(attrs)) {
        if (value !== undefined && value !== null) {
          node.setAttribute(key, String(value));
        }
      }
      return node;
    }

    function addText(parent, textValue, attrs = {}) {
      const node = createSvg("text", attrs);
      node.textContent = textValue;
      parent.append(node);
      return node;
    }

    function linearScale(domain, range) {
      const [d0, d1] = domain;
      const [r0, r1] = range;
      return (value) => {
        const t = (value - d0) / (d1 - d0);
        return r0 + t * (r1 - r0);
      };
    }

    function clearSvg() {
      const keep = Array.from(svg.children).filter((child) => child.tagName === "title" || child.tagName === "desc");
      svg.replaceChildren(...keep);
    }

    function metricDisplayValue(metric, point) {
      if (metric.key === "posterior_router_kl") return point.plotValue;
      return point.metricValue;
    }

    function visiblePoints(metric) {
      const points = metric.points.filter((point) => point.progress <= state.progress + 1e-9);
      return points.length > 0 ? points : [metric.points[0]];
    }

    function pathFromPoints(points, xScale, yScale, metric) {
      return points.map((point, index) => {
        const x = xScale(point.progress);
        const y = yScale(metricDisplayValue(metric, point));
        return (index === 0 ? "M " : "L ") + x.toFixed(2) + " " + y.toFixed(2);
      }).join(" ");
    }

    function metricValueAtProgress(metric, progress) {
      const points = metric.points;
      if (progress <= points[0].progress) return metricDisplayValue(metric, points[0]);
      if (progress >= points[points.length - 1].progress) {
        return metricDisplayValue(metric, points[points.length - 1]);
      }

      for (let index = 1; index < points.length; index += 1) {
        const previous = points[index - 1];
        const current = points[index];
        if (progress <= current.progress) {
          const span = current.progress - previous.progress;
          const weight = span === 0 ? 0 : (progress - previous.progress) / span;
          const previousValue = metricDisplayValue(metric, previous);
          const currentValue = metricDisplayValue(metric, current);
          return previousValue + weight * (currentValue - previousValue);
        }
      }

      return metricDisplayValue(metric, points[points.length - 1]);
    }

    function drawGrid(parent, xScale, yScale) {
      const grid = createSvg("g", { "aria-hidden": "true" });
      parent.append(grid);

      for (const tick of [0, 0.2, 0.4, 0.6, 0.8, 1]) {
        const x = xScale(tick);
        grid.append(createSvg("line", {
          x1: x,
          x2: x,
          y1: PLOT.top,
          y2: HEIGHT - PLOT.bottom,
          stroke: "var(--grid)",
          "stroke-width": 1,
          opacity: 0.62,
        }));
      }

      for (const tick of [0, 0.25, 0.5, 0.75, 1]) {
        const y = yScale(tick);
        grid.append(createSvg("line", {
          x1: PLOT.left,
          x2: WIDTH - PLOT.right,
          y1: y,
          y2: y,
          stroke: "var(--grid)",
          "stroke-width": 1,
          opacity: 0.52,
        }));
      }
    }

    function drawAxes(parent, xScale, yScale) {
      const axis = createSvg("g");
      parent.append(axis);

      const x0 = PLOT.left;
      const x1 = WIDTH - PLOT.right;
      const y0 = HEIGHT - PLOT.bottom;
      const y1 = PLOT.top;

      axis.append(createSvg("line", { x1: x0, x2: x1, y1: y0, y2: y0, stroke: "#111", "stroke-width": 2 }));
      axis.append(createSvg("line", { x1: x0, x2: x0, y1: y0, y2: y1, stroke: "#111", "stroke-width": 2 }));

      for (const tick of [0, 0.2, 0.4, 0.6, 0.8, 1]) {
        const x = xScale(tick);
        axis.append(createSvg("line", { x1: x, x2: x, y1: y0, y2: y0 + 7, stroke: "#111", "stroke-width": 1.5 }));
        addText(axis, tick.toFixed(1), {
          x,
          y: y0 + 30,
          "text-anchor": "middle",
          "font-size": 21,
          fill: "var(--ink)",
        });
      }

      for (const tick of [0, 0.25, 0.5, 0.75, 1]) {
        const y = yScale(tick);
        axis.append(createSvg("line", { x1: x0 - 7, x2: x0, y1: y, y2: y, stroke: "#111", "stroke-width": 1.5 }));
        addText(axis, tick === 0 || tick === 1 ? tick.toFixed(0) : tick.toFixed(2), {
          x: x0 - 13,
          y: y + 7,
          "text-anchor": "end",
          "font-size": 21,
          fill: "var(--ink)",
        });
      }

      addText(axis, FIGURE_DATA.xLabel, {
        x: (x0 + x1) / 2,
        y: HEIGHT - 18,
        "text-anchor": "middle",
        "font-size": 28,
        "font-weight": 650,
        fill: "var(--ink)",
      });

      const yLabel = addText(axis, FIGURE_DATA.yLabel, {
        x: 25,
        y: (y0 + y1) / 2,
        "text-anchor": "middle",
        "font-size": 28,
        "font-weight": 650,
        fill: "var(--ink)",
      });
      yLabel.setAttribute("transform", "rotate(-90 25 " + ((y0 + y1) / 2) + ")");
    }

    function drawMetric(metric, xScale, yScale) {
      const points = visiblePoints(metric);
      svg.append(createSvg("path", {
        d: pathFromPoints(points, xScale, yScale, metric),
        fill: "none",
        stroke: metric.color,
        "stroke-width": 5.2,
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
      }));

      const first = metric.points[0];
      const current = points[points.length - 1];
      for (const point of [first, current]) {
        svg.append(createSvg("circle", {
          cx: xScale(point.progress),
          cy: yScale(metricDisplayValue(metric, point)),
          r: point === current ? 8 : 6,
          fill: metric.color,
          stroke: metric.color,
          "stroke-width": 2.6,
        }));
      }

      const labelValue = metricValueAtProgress(metric, LABEL_X_PROGRESS);
      addText(svg, metric.label, {
        x: xScale(LABEL_X_PROGRESS),
        y: yScale(labelValue) + (LABEL_Y_OFFSET[metric.key] || 0),
        "text-anchor": "middle",
        "dominant-baseline": "middle",
        "font-size": 26,
        "font-weight": 500,
        fill: metric.color,
      });
    }

    function render() {
      clearSvg();
      const xScale = linearScale([0, 1], [PLOT.left, WIDTH - PLOT.right]);
      const yScale = linearScale([0, 1.05], [HEIGHT - PLOT.bottom, PLOT.top]);
      drawGrid(svg, xScale, yScale);
      drawAxes(svg, xScale, yScale);
      for (const metric of FIGURE_DATA.metrics) {
        drawMetric(metric, xScale, yScale);
      }
    }

    function nearestPoint(svgX, svgY) {
      const xScale = linearScale([0, 1], [PLOT.left, WIDTH - PLOT.right]);
      const yScale = linearScale([0, 1.05], [HEIGHT - PLOT.bottom, PLOT.top]);
      let best = null;

      for (const metric of FIGURE_DATA.metrics) {
        for (const point of visiblePoints(metric)) {
          const x = xScale(point.progress);
          const y = yScale(metricDisplayValue(metric, point));
          const distance = Math.hypot(svgX - x, svgY - y);
          if (!best || distance < best.distance) {
            best = { metric, point, distance };
          }
        }
      }
      return best && best.distance < 28 ? best : null;
    }

    function svgPointFromEvent(event) {
      const point = svg.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;
      return point.matrixTransform(svg.getScreenCTM().inverse());
    }

    function formatProgress(value) {
      return Math.round(value * 100) + "%";
    }

    function showTooltip(event, nearest) {
      tooltip.dataset.visible = "true";
      tooltip.setAttribute("aria-hidden", "false");
      const rawKl = nearest.metric.key === "posterior_router_kl"
        ? "<div class=\"tooltip__row\"><span>Raw KL</span><span>" + nearest.point.metricValue.toExponential(2) + "</span></div>"
        : "";
      tooltip.innerHTML =
        "<div class=\"tooltip__label\" style=\"color:" + nearest.metric.color + "\">" + nearest.metric.label + "</div>" +
        "<div class=\"tooltip__row\"><span>Progress</span><span>" + formatProgress(nearest.point.progress) + "</span></div>" +
        "<div class=\"tooltip__row\"><span>Value</span><span>" + metricDisplayValue(nearest.metric, nearest.point).toFixed(3) + "</span></div>" +
        rawKl;

      const shell = svg.parentElement.getBoundingClientRect();
      const left = Math.min(event.clientX - shell.left + 8, shell.width - 270);
      const top = Math.min(event.clientY - shell.top + 8, shell.height - 94);
      tooltip.style.left = Math.max(8, left) + "px";
      tooltip.style.top = Math.max(8, top) + "px";
    }

    function hideTooltip() {
      tooltip.dataset.visible = "false";
      tooltip.setAttribute("aria-hidden", "true");
    }

    function animateOnce() {
      if (state.hasAnimated) return;
      state.hasAnimated = true;
      state.progress = 0;
      render();

      const start = performance.now();
      function step(now) {
        const elapsed = Math.min(1, (now - start) / ANIMATION_MS);
        state.progress = 1 - Math.pow(1 - elapsed, 3);
        render();
        if (elapsed < 1) {
          requestAnimationFrame(step);
        } else {
          state.progress = 1;
          render();
        }
      }
      requestAnimationFrame(step);
    }

    function shouldAutoplay() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("autoplay") === "0") return false;
      if (params.get("autoplay") === "1") return true;
      return !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    svg.addEventListener("mousemove", (event) => {
      const point = svgPointFromEvent(event);
      const nearest = nearestPoint(point.x, point.y);
      if (nearest) showTooltip(event, nearest);
      else hideTooltip();
    });
    svg.addEventListener("mouseleave", hideTooltip);

    if (shouldAutoplay()) {
      state.progress = 0;
      render();
      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver((entries) => {
          if (entries.some((entry) => entry.isIntersecting && entry.intersectionRatio > 0.35)) {
            observer.disconnect();
            animateOnce();
          }
        }, { threshold: [0, 0.35, 0.7] });
        observer.observe(figure);
      } else {
        requestAnimationFrame(animateOnce);
      }
    } else {
      render();
    }
  </script>
